<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Blog</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-gray-900 via-black to-gray-800 text-gray-100 min-h-screen">

  <!-- Navbar -->
  <nav class="fixed top-0 left-0 w-full backdrop-blur-md bg-gray-900/40 border-b border-white/10 p-4 text-gray-100 flex space-x-6 shadow-lg z-50">
    <a href="/" class="text-xl font-bold hover:text-blue-400">Home</a>
    <a href="/blog/create" class="text-xl hover:text-blue-400">Create Blog</a>
  </nav>

  <!-- Blog Container -->
  <main class="max-w-8xl mx-auto mt-4 p-4">
    <h2 class="text-xl font-semibold mt-12 mb-4">Latest Posts</h2>
    <div id="posts" class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-10"></div>
  </main>

  <!-- Footer -->
  <footer class="bg-gray-800 text-white text-center p-4 mt-6">
    <p>&copy; 2026 My Blog. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
