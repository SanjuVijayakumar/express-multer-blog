<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Blog</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-gray-900 via-black to-gray-800 text-gray-100 min-h-screen">

  <!-- Navbar -->
  <nav class="fixed top-0 left-0 w-full backdrop-blur-md bg-gray-900/40 border-b border-white/10 p-4 text-gray-100 flex space-x-6 shadow-lg z-50">
    <a href="/" class="text-xl font-bold hover:text-blue-400">Home</a>
    <a href="/blog/create" class="text-xl hover:text-blue-400">Create Blog</a>
  </nav>

  <!-- Blog Form -->
  <main class="max-w-3xl mx-auto mt-4 p-4">
    <h2 class="text-xl font-semibold mt-12 mb-4">Create a Post</h2>
    <form id="postForm" class="space-y-4" enctype="multipart/form-data">
      <input type="text" name="title" placeholder="Title" class="border p-2 w-full text-black" required>
      <textarea name="content" placeholder="Content" class="border p-2 w-full text-black" required></textarea>
      <input type="text" name="author" placeholder="Author" class="border p-2 w-full text-black">
      <input type="file" name="images" accept="image/*" multiple class="border p-2 w-full">
      <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">Submit</button>
    </form>
  </main>

  <script src="/create.js"></script>
</body>
</html>
